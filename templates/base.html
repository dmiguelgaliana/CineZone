<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CineZone</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='img/logo.png') }}" height="45" class="me-2 logo">
            <span class="fw-bold fs-4">CineZone</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">About me</a></li>

                {% if session.get('usuario') %}
                    <li class="nav-item"><a class="nav-link" href="/privada"><i class="fa-solid fa-user"></i> Zona privada</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/registro"><i class="fa-solid fa-user-plus"></i> Registro</a></li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container" style="padding-top: 110px;">
    {% block contenido %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="footer text-center text-white py-4 mt-5">
    <p class="mb-0">CineZone © 2026 — Proyecto ASIX</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
